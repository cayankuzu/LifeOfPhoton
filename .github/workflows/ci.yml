name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository, so the token gets nothing more
permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, lint, test, build
    runs-on: ubuntu-latest
    # A healthy run takes a few minutes; without a limit a hung build would occupy the runner for six hours
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
